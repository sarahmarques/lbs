parameters:
- name: major
  type: string
- name: minor
  type: string
- name: patch
  type: string
- name: isBeta
  type: boolean
  default: false  

jobs:
- job: VersionDeployment
  displayName: Version Deployment
  steps:
  - checkout: self
    persistCredentials: true
  - task: UseDotNet@2
    inputs:
      packageType: 'sdk'
      version: '5.0.x'
  - script: |
      if [[ "${{ parameters.isBeta }}" == "true" ]]; then
        buildNumber=${{ parameters.major }}.${{ parameters.minor }}.${{ parameters.patch }}-beta.$(Build.BuildNumber)
      else
        buildNumber=${{ parameters.major }}.${{ parameters.minor }}.${{ parameters.patch }}
      fi
      
      buildName="Build v$buildNumber" 
      echo "Setting the name of the build to '$buildName'."
      echo "##vso[build.updatebuildnumber]$buildName"
      echo "##vso[task.setvariable variable=BuildNumber;isOutput=true]$buildNumber"
    displayName: 'Calculate Build Number'

  - ${{ if eq(parameters.isBeta, false) }}:
    - task: DotNetCoreCLI@2
      displayName: 'Install ALMOPS'
      inputs:
        command: custom
        custom: tool
        arguments: 'install --global almops'
    - bash: |
        almops config --org $(ORGANISATION_NAME) --token $(System.AccessToken)
        almops update variables -p $(System.TeamProject) --id $(VARIABLE_GROUP_ID) --type group --var "PATCH_VERSION:${{ parameters.patch }}"
      displayName: 'Update Patch Variable'