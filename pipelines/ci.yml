trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
- group: lbs-website-environments
- group: lbs-website-ci
# If true then this will only build and test not track a deployment
- name: IS_MINIMAL_DEPLOYMENT
  value: false


## DEPLOY SOLUTION
stages:
- ${{ if eq(variables['IS_MINIMAL_DEPLOYMENT'], false) }}:
  - template: templates/deploy-environment.yml
    parameters:
      devOpsEnvironment: $(ENVIRONMENT_CI)
      siteId: $(NETLIFY_SITE_ID)
- ${{ if eq(variables['IS_MINIMAL_DEPLOYMENT'], true) }}:
  - stage: BuildAndDeploy
    displayName: 'Build and Deploy Site'
    jobs:
    - job: BuildAndTest
      displayName: Build and Test
      steps:
      - template: templates/build-and-test.yml